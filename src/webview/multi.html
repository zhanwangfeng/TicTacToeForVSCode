<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>井字棋 · 联机对战</title>
<style>
  :root{
    --bg:#f5f6f8;
    --panel:#ffffff;
    --line:#e3e6ea;
    --ink:#2b2f36;
    --muted:#8b929c;
    --x:#3a7afe;     /* X */
    --o:#f0734d;     /* O */
    --accent:#3a7afe;
    --win:#2fbf71;
    --vanish:#e8a33d;
  }
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:22px; padding:32px 16px;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg); color:var(--ink);
  }
  h1{font-size:22px; font-weight:600; margin:0; letter-spacing:.5px}
  .sub{font-size:13px; color:var(--muted); margin:-12px 0 0}

  .panel{
    background:var(--panel); border:1px solid var(--line); border-radius:18px;
    padding:22px; box-shadow:0 12px 30px rgba(20,30,50,.06);
    display:flex; flex-direction:column; align-items:center; gap:18px;
    width:min(92vw,360px); transition:box-shadow .3s, border-color .3s;
  }

  .net{
    width:100%; display:flex; align-items:center; justify-content:center; gap:7px;
    font-size:12px; color:var(--muted); background:var(--bg);
    border:1px dashed var(--line); border-radius:10px; padding:8px 10px; text-align:center;
  }
  .net .live{width:7px; height:7px; border-radius:50%; background:#c9ced6; flex:none}
  .net.on .live{background:var(--win)}
  .net.err .live{background:#e05252}
  .net b{color:var(--ink); font-weight:600}
  .net[hidden]{display:none}

  .opts{
    width:100%; display:flex; align-items:center; justify-content:center; gap:8px;
    background:var(--bg); border:1px solid var(--line); border-radius:12px;
    padding:11px 14px; cursor:pointer; font-size:13.5px; color:var(--ink);
    user-select:none; transition:.15s; white-space:nowrap;
    position:relative;
  }
  .opts:hover{border-color:var(--accent)}
  .opts.show-tip:hover::after{
    content:attr(data-tip);
    position:absolute; bottom:calc(100% + 8px); left:50%; transform:translateX(-50%);
    background:var(--ink); color:#fff; font-size:12px; line-height:1.5; text-align:center;
    padding:9px 11px; border-radius:9px; width:max-content; max-width:240px;
    white-space:normal; box-shadow:0 8px 20px rgba(20,30,50,.22); z-index:30; pointer-events:none;
  }
  .opts.show-tip:hover::before{
    content:""; position:absolute; bottom:calc(100% + 2px); left:50%; transform:translateX(-50%);
    border:6px solid transparent; border-top-color:var(--ink); z-index:30; pointer-events:none;
  }
  .opts .dot{width:7px; height:7px; border-radius:50%; background:var(--accent); flex:none}
  .opts .txt{flex:1; text-align:center}

  .overlay{
    position:fixed; inset:0; background:rgba(20,30,50,.35); z-index:20;
    display:flex; align-items:center; justify-content:center; padding:20px;
  }
  .overlay[hidden]{display:none}
  .sheet{
    background:var(--panel); border-radius:18px; padding:20px; width:min(92vw,340px);
    box-shadow:0 20px 50px rgba(20,30,50,.2); display:flex; flex-direction:column; gap:16px;
  }
  .sheet-head{display:flex; align-items:center; justify-content:space-between; font-size:16px; font-weight:600}
  .sheet-head .x{border:none; background:transparent; font-size:22px; color:var(--muted); cursor:pointer; line-height:1; padding:0}
  .field{display:flex; flex-direction:column; gap:8px}
  .field > label{font-size:12px; color:var(--muted)}
  .field .seg{justify-content:center}

  .seg{display:flex; background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:3px}
  .seg button{
    border:none; background:transparent; color:var(--muted); font-size:13px;
    padding:6px 12px; border-radius:8px; cursor:pointer; font-family:inherit; transition:.15s;
  }
  .seg button.on{background:#fff; color:var(--ink); box-shadow:0 1px 3px rgba(0,0,0,.08)}
  .seg button:disabled{opacity:.45; cursor:default}
  .hint[hidden]{display:none}

  .status{font-size:14px; min-height:20px; text-align:center; color:var(--muted)}
  .status b{color:var(--ink)}
  .hint{font-size:12px; color:var(--muted); margin:0; min-height:16px; text-align:center}

  .board{
    display:grid; grid-template-columns:repeat(3,92px); gap:10px;
  }
  .board[hidden]{display:none}
  /* 普通/超级：给棋盘独立外框，使其与面板明显分隔（终极模式用自带样式，不叠加） */
  .board:not(.ultimate){
    padding:8px; background:var(--panel); border:1px solid var(--line);
    border-radius:16px; box-shadow:0 2px 10px rgba(20,30,50,.05);
  }
  .cell{
    width:92px; height:92px;
    background:var(--bg); border:1px solid var(--line); border-radius:14px;
    display:flex; align-items:center; justify-content:center;
    font-size:46px; font-weight:600; cursor:pointer; user-select:none;
    transition:background .15s, transform .08s, border-color .15s; color:var(--ink);
  }
  .cell:hover:not(.filled){background:#eef1f5}
  .cell:active:not(.filled){transform:scale(.96)}
  .cell.x{color:var(--x)}
  .cell.o{color:var(--o)}
  .cell.filled{cursor:default}
  .cell.win{background:rgba(47,191,113,.12); box-shadow:inset 0 0 0 2px var(--win)}
  .cell.vanish{box-shadow:inset 0 0 0 2px var(--vanish); animation:vanishPulse .5s ease-in-out infinite}
  .mark{animation:pop .18s ease-out}
  @keyframes pop{from{transform:scale(.4);opacity:0} to{transform:scale(1);opacity:1}}
  @keyframes vanishPulse{0%,100%{background:rgba(232,163,61,.10)}50%{background:rgba(232,163,61,.30)}}

  /* ---------- 超级模式：更酷的主题 ---------- */
  body.super{
    --accent:#8b5cf6;
    --x:#22d3ee;
    --o:#f472b6;
    --vanish:#a78bfa;
  }
  body.super .panel{
    border-color:rgba(139,92,246,.45);
    box-shadow:0 16px 44px rgba(139,92,246,.22), 0 0 0 1px rgba(139,92,246,.18);
  }
  body.super .opts{border-color:rgba(139,92,246,.45)}
  body.super .cell{
    background:rgba(255,255,255,.72);
    border-color:rgba(139,92,246,.30);
  }
  body.super .cell:hover:not(.filled){background:rgba(34,211,238,.14)}
  body.super .cell.vanish{
    box-shadow:inset 0 0 0 2px var(--vanish);
    animation:vanishPulseSuper .5s ease-in-out infinite;
  }
  @keyframes vanishPulseSuper{
    0%,100%{background:rgba(167,139,250,.12)}
    50%{background:rgba(167,139,250,.40)}
  }

  /* ---------- 终极模式 ---------- */
  body.ultimate .panel{ width:min(94vw,500px); }
  /* 流式布局：minmax(0,1fr) 禁止内容参与轨道计算，防止落子后出现正反馈撑爆布局；
     棋盘整体 aspect-ratio:1 + 行列均分，使小盘/格子天然为正方形 */
  .board.ultimate{
    width:100%; box-sizing:border-box;
    grid-template-columns:repeat(3,minmax(0,1fr));
    grid-template-rows:repeat(3,minmax(0,1fr));
    aspect-ratio:1;
    gap:8px; padding:8px;
    background:var(--bg); border-radius:18px;
  }
  .small-board{
    display:grid; grid-template-columns:repeat(3,minmax(0,1fr));
    grid-template-rows:repeat(3,minmax(0,1fr));
    gap:4px; padding:4px; min-width:0; min-height:0;
    position:relative; border-radius:12px; background:var(--panel); border:1px solid var(--line); transition:.15s;
  }
  .board.ultimate .cell{
    width:auto; height:auto; min-width:0; min-height:0;
    font-size:clamp(13px, 3.2vw, 22px); border-radius:8px;
  }
  .small-board.active{ border-color:var(--accent); box-shadow:0 0 0 2px var(--accent); }
  .small-board.locked{ opacity:.5; }
  .small-board.big-won{ background:rgba(58,122,254,.08); }
  .small-board.win{ border-color:var(--win); box-shadow:0 0 0 2px var(--win); }
  .big-mark{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-weight:700; pointer-events:none; font-size:clamp(40px, 11vw, 100px); animation:bigMarkPop .18s ease-out; }
  .big-mark.x{ color:var(--x); }
  .big-mark.o{ color:var(--o); }
  .big-mark.draw{ color:var(--muted); font-size:clamp(30px, 8vw, 76px); }
  @keyframes bigMarkPop{ from{ transform:scale(.6); opacity:0; } to{ transform:scale(1); opacity:1; } }

  .actions{display:flex; gap:10px; width:100%}
  .actions[hidden]{display:none}
  .btn{
    flex:1; border:1px solid var(--line); background:#fff; color:var(--ink);
    font-size:14px; padding:10px; border-radius:10px; cursor:pointer;
    font-family:inherit; transition:.15s;
  }
  .btn:hover{border-color:var(--accent); color:var(--accent)}
  .btn.primary{background:var(--accent); border-color:var(--accent); color:#fff}
  .btn.primary:hover{filter:brightness(1.05); color:#fff}
  .btn[hidden]{display:none}

  .score{display:flex; gap:18px; font-size:13px; color:var(--muted)}
  .score b{color:var(--ink)}
  .score[hidden]{display:none}
</style>
</head>
<body>
  <h1>井字棋 · 联机对战</h1>
  <p class="sub" id="sub"></p>

  <div class="panel">
    <div class="net" id="net"><span class="live"></span><span id="netText">正在初始化…</span></div>

    <div class="opts" id="optsBtn">
      <span class="dot"></span>
      <span class="txt" id="optsText"></span>
      <span class="dot"></span>
    </div>

    <div class="overlay" id="overlay" hidden>
      <div class="sheet">
        <div class="sheet-head">
          <span>游戏设置</span>
          <button class="x" id="closeSheet" aria-label="关闭">×</button>
        </div>
        <div class="field">
          <label>玩法</label>
          <div class="seg" id="mode">
            <button data-m="normal">普通</button>
            <button data-m="super">超级</button>
            <button data-m="ultimate">终极</button>
          </div>
          <p class="hint" id="modeHint"></p>
          <p class="hint" id="modeLock" hidden></p>
        </div>
        <p class="hint">玩法由房主在开局前或本局结束后调整，修改后立即同步给对手并重开一局；双方每局轮流先手。</p>
        <button class="btn primary" id="applySheet">确定</button>
      </div>
    </div>

    <button class="btn primary" id="startBtn" hidden>开始游戏</button>

    <div class="status" id="status">等待对手加入…</div>

    <div class="board" id="board" hidden></div>

    <div class="score" id="scoreBox" hidden>
      <span>胜 <b id="sw">0</b></span>
      <span>负 <b id="sl">0</b></span>
      <span>平 <b id="sd">0</b></span>
    </div>

    <div class="actions" id="actionsBox" hidden>
      <button class="btn primary" id="restart">重新开始</button>
    </div>
  </div>

<script>
/* ---------- 联机身份（由扩展注入，见 LanMultiplayer.buildBootstrap） ---------- */
const BOOT = __MULTI_BOOTSTRAP_VALUE__;
const ROLE = (BOOT && BOOT.role === 'client') ? 'client' : 'host';
const MY   = ROLE === 'host' ? 'X' : 'O';          // 房主 X，加入方 O
const OP   = MY === 'X' ? 'O' : 'X';

const boardEl = document.getElementById('board');
const statusEl = document.getElementById('status');
const netEl = document.getElementById('net');

let board = Array(9).fill('');
let over = false;
let started = false;        // 已开局（收到 newGame）
let connected = false;      // 对手在线
let turn = 'X';             // 当前该谁落子
let mode = 'normal';
let firstMark = 'X';        // 本局先手方（'X' | 'O'）
let nextFirst = 'X';        // 下一局先手方：双方每局轮流先手
let pieceOrder = [];
let pendingVanish = null;   // 超级模式：本回合即将被移除的最旧棋子格号
let boards = Array.from({length:9}, () => Array(9).fill(''));  // 终极模式：9 个小棋盘
let bigWinner = Array(9).fill('');   // 终极模式：大九宫每格归属 X/O/D/''
let activeBoard = null;     // 终极模式：强制落子盘 0-8；null=任意盘
let score = { w:0, l:0, d:0 };

const LINES = [
  [0,1,2],[3,4,5],[6,7,8],
  [0,3,6],[1,4,7],[2,5,8],
  [0,4,8],[2,4,6]
];

/* ---------- 渲染 ---------- */
function buildBoard(){
  boardEl.innerHTML = '';
  if (mode === 'ultimate'){
    boardEl.className = 'board ultimate';
    buildBoardUltimate();
  } else {
    boardEl.className = 'board';
    buildBoardSingle();
  }
}
function buildBoardSingle(){
  for (let i=0;i<9;i++){
    const c = document.createElement('div');
    c.className = 'cell';
    c.addEventListener('click', () => onCell(i));
    boardEl.appendChild(c);
  }
}
function buildBoardUltimate(){
  for (let b=0;b<9;b++){
    const sb = document.createElement('div');
    sb.className = 'small-board';
    for (let s=0;s<9;s++){
      const c = document.createElement('div');
      c.className = 'cell';
      c.addEventListener('click', () => onCellUltimate(b, s));
      sb.appendChild(c);
    }
    boardEl.appendChild(sb);
  }
}

function setStatus(html){ statusEl.innerHTML = html; }

function place(i, p){
  board[i] = p;
  if (mode === 'super') pieceOrder.push({ i, p });
  const c = boardEl.children[i];
  c.classList.add('filled', p.toLowerCase());
  c.innerHTML = '<span class="mark">' + p + '</span>';
  sndMove(p === MY ? 1 : 2);
}

/* ---------- 交互 ---------- */
function canPlay(){ return started && connected && !over && turn === MY; }

function onCell(i){
  if (!canPlay() || board[i]) return;
  doMoveSingle(i, MY);
  post({ type:'move', i:i });
}

// 普通 / 超级：落子 -> 判定 -> 超级模式移除最旧一子 -> 交换回合
function doMoveSingle(i, p){
  if (board[i]) return;
  place(i, p);
  const w = lineWinner(board);
  if (w){ endGame(w); return; }
  if (!board.includes('')){ endDraw(); return; }
  if (mode === 'super' && pendingVanish !== null){
    const cellIdx = pendingVanish;
    pendingVanish = null;
    sndVanish();
    board[cellIdx] = '';
    const oi = pieceOrder.findIndex(o => o.i === cellIdx && o.p === p);
    if (oi >= 0) pieceOrder.splice(oi, 1);
    const cell = boardEl.children[cellIdx];
    cell.className = 'cell'; cell.innerHTML = '';
  }
  switchTurn(p);
}

function switchTurn(p){
  turn = p === 'X' ? 'O' : 'X';
  clearVanish();
  preHighlight(turn);
  updateStatus();
}

/* ---------- 规则判定 ---------- */
function lineWinner(b){
  for (const [a,x,c] of LINES){
    if (b[a] && b[a]===b[x] && b[a]===b[c]) return b[a];
  }
  return null;
}
function countOf(p){ let n=0; for (let i=0;i<9;i++) if (board[i]===p) n++; return n; }

// 回合开始（落子前）预高亮：超级模式下，若本方已有 3 子，则高亮最旧的一子（即将被移除）
function clearVanish(){
  pendingVanish = null;
  [...boardEl.children].forEach(c => c.classList.remove('vanish'));
}
function preHighlight(p){
  clearVanish();
  if (mode === 'super' && countOf(p) === 3){
    const idx = pieceOrder.findIndex(o => o.p === p);
    const cellIdx = pieceOrder[idx].i;
    boardEl.children[cellIdx].classList.add('vanish');
    pendingVanish = cellIdx;
  }
}

// 结束文案：房主显示胜负并可点「重新开始」，加入方只提示等待房主重开
function overText(hostText){ return ROLE === 'host' ? hostText : '等待游戏重新开始…'; }

function endGame(w){
  over = true;
  clearVanish();
  if (mode === 'ultimate') highlightBigWin(w); else highlightWin(w);
  if (w === MY){ score.w++; setStatus(overText('你赢了 🎉')); sndWin(); }
  else { score.l++; setStatus(overText('对手赢了')); sndLose(); }
  updateScore();
  refreshLayout();
}
function endDraw(){
  over = true;
  clearVanish();
  score.d++; setStatus(overText('平局')); sndDraw(); updateScore();
  refreshLayout();
}

function highlightWin(p){
  for (const [a,x,c] of LINES){
    if (board[a]===p && board[x]===p && board[c]===p){
      [a,x,c].forEach(i => boardEl.children[i].classList.add('win'));
      return;
    }
  }
}

/* ---------- 终极模式：交互与规则 ---------- */
function onCellUltimate(big, small){
  if (!canPlay()) return;
  if (bigWinner[big] !== '') return;
  if (activeBoard !== null && activeBoard !== big) return;
  if (boards[big][small] !== '') return;
  doMoveUltimate(big, small, MY);
  post({ type:'move', big:big, small:small });
}
function placeUltimate(big, small, p){
  boards[big][small] = p;
  const cell = boardEl.children[big].children[small];
  cell.classList.add('filled', p.toLowerCase());
  cell.innerHTML = '<span class="mark">' + p + '</span>';
  sndMove(p === MY ? 1 : 2);
}
function doMoveUltimate(big, small, p){
  if (bigWinner[big] !== '' || boards[big][small] !== '') return;
  placeUltimate(big, small, p);
  const sw = lineWinner(boards[big]);
  if (sw){
    bigWinner[big] = sw;
    markSmallWon(big, sw);
  } else if (boards[big].every(v=>v!=='')){
    bigWinner[big] = 'D';
    markSmallDraw(big);
  }
  const bw = lineWinner(bigWinner);
  if (bw){ endGame(bw); return; }
  if (bigWinner.every(v=>v!=='')){ endDraw(); return; }
  const target = small;   // 落子于小盘第 small 格 -> 对手下一手落在第 small 个大格
  activeBoard = (bigWinner[target] !== '' || boards[target].every(v=>v!=='')) ? null : target;
  turn = p === 'X' ? 'O' : 'X';
  highlightActive();
  updateStatus();
}
function markSmallWon(big, p){
  ensureAudio();
  tone(659.25, 0.10, 'triangle', 0, 0.12);
  tone(987.77, 0.10, 'triangle', 0.05, 0.10);
  const sb = boardEl.children[big];
  sb.classList.add('big-won');
  const ov = document.createElement('div');
  ov.className = 'big-mark ' + p.toLowerCase();
  ov.textContent = p;
  sb.appendChild(ov);
}
function markSmallDraw(big){
  const sb = boardEl.children[big];
  sb.classList.add('big-won');
  const ov = document.createElement('div');
  ov.className = 'big-mark draw';
  ov.textContent = '=';
  sb.appendChild(ov);
}
function highlightBigWin(p){
  for (const [a,x,c] of LINES){
    if (bigWinner[a]===p && bigWinner[x]===p && bigWinner[c]===p){
      [a,x,c].forEach(i => boardEl.children[i].classList.add('win'));
      return;
    }
  }
}
function highlightActive(){
  for (let b=0;b<9;b++){
    const sb = boardEl.children[b];
    const finished = bigWinner[b] !== '';
    const isActive = !finished && (activeBoard === null || activeBoard === b);
    sb.classList.toggle('active', isActive);
    sb.classList.toggle('locked', finished || (activeBoard !== null && activeBoard !== b));
  }
}

function updateScore(){
  document.getElementById('sw').textContent = score.w;
  document.getElementById('sl').textContent = score.l;
  document.getElementById('sd').textContent = score.d;
}

function updateStatus(){
  if (over) return;                 // 结束文案由 endGame / endDraw 设置
  if (!connected){ setStatus('等待对手连接…'); return; }
  if (!started){
    setStatus(ROLE === 'host' ? '双方已就位，点击「开始游戏」' : '等待房主开始游戏…');
    return;
  }
  if (turn === MY){
    if (mode === 'ultimate'){
      const where = activeBoard === null ? '任意小棋盘' : '高亮的小棋盘';
      setStatus('轮到你了 · 请落在' + where);
    } else {
      setStatus('轮到你了');
    }
  } else {
    setStatus('等待对手落子…');
  }
}

/* ---------- 向扩展（VS Code）回传消息 ---------- */
let vscodeApi = null;
try { vscodeApi = acquireVsCodeApi(); } catch(e){ vscodeApi = null; }
function post(msg){
  try { if (vscodeApi) vscodeApi.postMessage(msg); } catch(e){}
}

/* ---------- 连接状态条 ---------- */
function netAddr(){
  return ROLE === 'host'
    ? (BOOT.localIp || BOOT.host || '') + ':' + BOOT.port
    : (BOOT.host || '') + ':' + BOOT.port;
}
function updateNet(text, ok){
  netEl.classList.toggle('on', ok === true);
  netEl.classList.toggle('err', ok === false);
  const role = ROLE === 'host' ? '房主' : '加入方';
  document.getElementById('netText').innerHTML = role + ' · <b>' + netAddr() + '</b> · ' + text;
}

/* ---------- 开局 / 同步 ---------- */
// 房主点击「开始游戏」：广播 newGame（由扩展自动转发给所有 peer）并在本地生效
function startGame(){
  if (ROLE !== 'host' || !connected) return;
  broadcastNewGame(mode, nextFirst);
}
// 开局 / 重开：广播新局，双方各自重置（设置以消息为准，状态收敛）
function broadcastNewGame(m, f){
  post({ type:'newGame', mode:m, first:f });
  newGame(m, f);
}
// 玩法是否可改：只有房主可以改，且游戏进行中不可改
function modeEditable(){ return ROLE === 'host' && !(started && !over); }
// 按当前阶段切换各区块显隐：未开局隐藏棋盘、开局后隐藏连接信息
function refreshLayout(){
  const ready = connected && !started;
  document.getElementById('startBtn').hidden = !(ROLE === 'host' && ready);   // 只有房主且双方就位才显示
  document.getElementById('net').hidden = !!started;                          // 开局后隐藏连接信息
  boardEl.hidden = !started;                                                  // 未开局不显示棋盘
  document.getElementById('scoreBox').hidden = !started;
  document.getElementById('actionsBox').hidden = !(over && ROLE === 'host'); // 仅房主在游戏结束后可重开
  updateOptsText();
}
function newGame(m, f){
  if (m === 'normal' || m === 'super' || m === 'ultimate') mode = m;
  if (f === 'X' || f === 'O'){
    firstMark = f;
    nextFirst = f === 'X' ? 'O' : 'X';   // 本局先手确定后，下一局换另一方先手
  }
  started = true;
  over = false;
  turn = firstMark;
  syncOptionsUI();
  updateOptsText();
  updateRule();
  sndStart();
  if (mode === 'ultimate'){
    boards = Array.from({length:9}, () => Array(9).fill(''));
    bigWinner = Array(9).fill('');
    activeBoard = null;
    buildBoard();
    highlightActive();
  } else {
    board = Array(9).fill('');
    pieceOrder = [];
    pendingVanish = null;
    buildBoard();
    preHighlight(turn);
  }
  refreshLayout();
  updateStatus();
}

function onRemoteMove(d){
  if (over || !started) return;
  if (mode === 'ultimate'){
    if (typeof d.big !== 'number' || typeof d.small !== 'number') return;
    doMoveUltimate(d.big, d.small, OP);
  } else {
    if (typeof d.i !== 'number') return;
    doMoveSingle(d.i, OP);
  }
}

/* ---------- 选项存盘（联机模式仅存本机偏好，实际以房主开局同步为准） ---------- */
function syncOptionsUI(){
  document.querySelectorAll('#mode button').forEach(b=>b.classList.toggle('on', b.dataset.m===mode));
}
const MODE_LABEL = { normal:'普通', super:'超级', ultimate:'终极' };
function updateOptsText(){
  const first = started ? (firstMark === MY ? '本局你先手' : '本局对手先手') : '轮流先手';
  document.getElementById('optsText').textContent = `${MODE_LABEL[mode]||'普通'} · ${first}`;
}
function loadOptions(){
  try {
    const s = JSON.parse(localStorage.getItem('ttt_multi_options') || '{}');
    if (s.mode) mode = s.mode;
  } catch(e){}
  syncOptionsUI();
  updateOptsText();
}
function saveOptions(){
  try { localStorage.setItem('ttt_multi_options', JSON.stringify({ mode:mode })); } catch(e){}
}

/* ---------- 设置弹层 ---------- */
const overlay = document.getElementById('overlay');
function openSheet(){
  syncOptionsUI();
  updateRule();
  const editable = modeEditable();
  document.querySelectorAll('#mode button').forEach(b => { b.disabled = !editable; });
  const lock = document.getElementById('modeLock');
  lock.hidden = editable;
  lock.textContent = ROLE === 'host' ? '游戏进行中，本局结束后才能修改玩法' : '玩法由房主决定';
  overlay.hidden = false;
}
function closeSheet(){ overlay.hidden = true; }
document.getElementById('optsBtn').addEventListener('click', openSheet);
document.getElementById('closeSheet').addEventListener('click', closeSheet);
document.getElementById('applySheet').addEventListener('click', ()=>{
  if (!modeEditable()){ closeSheet(); return; }        // 加入方 / 进行中：不允许修改玩法
  const newMode = document.querySelector('#mode button.on').dataset.m;
  saveOptions();
  if (started){
    broadcastNewGame(newMode, nextFirst);              // 本局已结束：改玩法即同步给对手并重开一局
  } else {
    mode = newMode;                                    // 未开局：仅本地生效，房主开局时同步
    syncOptionsUI(); updateOptsText(); updateRule();
  }
  closeSheet();
});
overlay.addEventListener('click', e=>{ if (e.target === overlay) closeSheet(); });

/* ---------- 音效 ---------- */
let audioCtx = null;
let soundOn = (BOOT && typeof BOOT.soundOn === 'boolean') ? BOOT.soundOn : true;
function ensureAudio(){
  if (!audioCtx){
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){ audioCtx = null; }
  }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}
function tone(freq, dur, type, when, vol){
  if (!soundOn || !audioCtx) return;
  const t0 = audioCtx.currentTime + (when || 0);
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type || 'sine';
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(0.0001, t0);
  gain.gain.exponentialRampToValueAtTime(vol || 0.15, t0 + 0.012);
  gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  osc.connect(gain).connect(audioCtx.destination);
  osc.start(t0);
  osc.stop(t0 + dur + 0.02);
}
function sndMove(side){
  ensureAudio();
  if (side === 1){                       // 自己（明亮上行）
    tone(523.25, 0.12, 'triangle', 0, 0.16);
    tone(783.99, 0.10, 'triangle', 0.06, 0.12);
  } else {                               // 对手（低沉下行）
    tone(329.63, 0.12, 'triangle', 0, 0.14);
    tone(246.94, 0.10, 'triangle', 0.06, 0.10);
  }
}
function sndWin(){
  ensureAudio();
  [523.25, 659.25, 783.99, 1046.5].forEach((f,i)=> tone(f, 0.18, 'triangle', i*0.09, 0.16));
}
function sndLose(){
  ensureAudio();
  [392, 330, 262, 196].forEach((f,i)=> tone(f, 0.20, 'sawtooth', i*0.10, 0.12));
}
function sndDraw(){
  ensureAudio();
  tone(440, 0.16, 'sine', 0, 0.14);
  tone(440, 0.16, 'sine', 0.18, 0.14);
}
function sndVanish(){
  ensureAudio();
  tone(880, 0.10, 'sine', 0, 0.12);
  tone(440, 0.12, 'sine', 0.05, 0.10);
}
function sndStart(){
  ensureAudio();
  [523.25, 587.33, 659.25, 783.99].forEach((f,i)=> tone(f, 0.14, 'triangle', i*0.08, 0.14));
}

/* ---------- 控件（仅切换选择，确认后生效） ---------- */
function selectOnly(group, btn){
  [...group.children].forEach(x=>x.classList.toggle('on', x===btn));
}
document.getElementById('mode').addEventListener('click', e=>{
  const b = e.target.closest('button'); if (!b || b.disabled) return;
  selectOnly(e.currentTarget, b);
});

function updateRule(){
  let tip = '';
  if (mode === 'super') tip = '双方各最多保留 3 子，落子后超出的最旧一子会高亮并消失';
  else if (mode === 'ultimate') tip = '9 个小棋盘拼成大九宫：你落在某盘第几格，对手下一手就必须落在对应位置的大盘。';
  document.getElementById('modeHint').textContent = tip;
  const opts = document.getElementById('optsBtn');
  if (tip){ opts.setAttribute('data-tip', tip); opts.title = tip; opts.classList.add('show-tip'); }
  else { opts.removeAttribute('data-tip'); opts.removeAttribute('title'); opts.classList.remove('show-tip'); }
  document.body.classList.toggle('super', mode === 'super');
  document.body.classList.toggle('ultimate', mode === 'ultimate');
}

document.getElementById('startBtn').addEventListener('click', ()=> startGame());
document.getElementById('restart').addEventListener('click', ()=> {
  if (started && ROLE === 'host') broadcastNewGame(mode, nextFirst);   // 只有房主能重开，且下一局换另一方先手
});

/* ---------- 初始化 ---------- */
document.getElementById('sub').innerHTML =
  `你执 <span style="color:var(--${MY.toLowerCase()})">${MY}</span>，对手执 <span style="color:var(--${OP.toLowerCase()})">${OP}</span>`;
loadOptions();
updateRule();
buildBoard();
refreshLayout();
updateNet(ROLE === 'host' ? '正在创建房间…' : '正在连接房间…', null);

/* ---------- 联机生命周期（消息 type 由 common 模块统一约定） ---------- */
window.addEventListener('message', e => {
  const d = e.data;
  if (!d) return;
  switch (d.type){
    case 'hostReady':
      updateNet('房间已创建，等待对手加入', null);
      break;
    case 'hostError':
      updateNet('房间创建失败：' + (d.message || ''), false);
      setStatus('无法创建房间，请检查端口是否被占用');
      break;
    case 'peerConnected':       // 房主侧：对手加入 -> 显示「开始游戏」按钮，等待房主点开始
      connected = true;
      updateNet('对手已加入', true);
      refreshLayout();
      updateStatus();
      break;
    case 'peerDisconnected':    // 对手掉线：回到等待态（收起棋盘、重新显示连接信息）
      connected = false; started = false; over = false;
      updateNet('对手已断开', false);
      refreshLayout();
      updateStatus();
      break;
    case 'clientConnected':     // 加入方：已连上房间，等待房主点「开始游戏」
      connected = true;
      updateNet('已加入房间', true);
      refreshLayout();
      updateStatus();
      break;
    case 'clientDisconnected':
      connected = false; started = false; over = false;
      updateNet('连接已断开', false);
      refreshLayout();
      updateStatus();
      break;
    case 'clientTimeout':
    case 'clientRefused':
    case 'clientError':
      connected = false; started = false; over = false;
      updateNet('连接失败', false);
      refreshLayout();
      setStatus(d.message || '连接房间失败，请检查地址与局域网');
      break;
    case 'newGame':             // 房主开局 / 任一方重开（双方同时生效）
      newGame(d.mode, d.first);
      break;
    case 'move':                // 对手落子，坐标与本方一致，无需镜像
      onRemoteMove(d);
      break;
    case 'setSound':            // 侧栏「音效开关」下发，面板内不再提供音效按钮
      soundOn = !!d.on;
      if (soundOn) ensureAudio();
      break;
  }
});
</script>
